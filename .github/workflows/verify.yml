name: Verify

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: operion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPERION_TEST_ACTION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/operion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra observability
      - name: Lint
        run: uv run --frozen --extra observability ruff check src tests
      - name: Offline suite
        run: env -u OPERION_TEST_ACTION_DATABASE_URL PYDANTIC_AI_NO_BANNER=1 PYTHONPATH=src uv run --frozen --extra observability python -m unittest discover -s tests -q
      - name: PostgreSQL integration suite
        run: PYDANTIC_AI_NO_BANNER=1 PYTHONPATH=src uv run --frozen --extra observability python scripts/test_postgres.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build -- --webpack
