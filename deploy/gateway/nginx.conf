events {}
http {
    # Nginx error logs can include raw callback URLs. Record only safe route
    # categories/status/timing; never log query strings or request headers.
    map $uri $route_group {
        default web;
        ~^/api/ api;
        ~^/oauth2/ oauth;
        ~^/identity/ identity;
    }
    log_format gateway '$time_iso8601 $request_method $route_group $status $request_time';
    access_log /dev/stdout gateway;
    error_log /dev/null;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map "$request_method:$http_origin" $bad_origin {
        default 1;
        ~^(GET|HEAD|OPTIONS): 0;
        ~^(POST|PUT|PATCH|DELETE):https://operion\.localhost:8443$ 0;
    }
    server {
        listen 8443 ssl default_server;
        server_name operion.localhost;
        ssl_certificate /run/tls/server.crt;
        ssl_certificate_key /run/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 1m;
        large_client_header_buffers 4 16k;
        if ($http_host != "operion.localhost:8443") { return 421; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # Only public realm login/discovery/assets. No Keycloak administration.
        location ~ ^/identity/(realms/operion/|resources/) {
            set $identity http://keycloak:8080;
            proxy_pass $identity;
            proxy_set_header Host operion.localhost:8443;
            proxy_set_header X-Forwarded-Host operion.localhost:8443;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
        }
        location /identity { return 404; }
        location = /oauth2/sign_out {
            if ($request_method != POST) { return 405; }
            if ($bad_origin) { return 403; }
            # No caller-controlled logout redirect.
            set $proxy http://oauth2-proxy:4180;
            proxy_pass $proxy/oauth2/sign_out?rd=%2Fsigned-out;
            include /etc/nginx/proxy_params_operion;
        }
        location = /signed-out {
            default_type text/html;
            return 200 '<!doctype html><html lang="en"><title>Signed out</title><h1>Signed out</h1><p>Your Operion session has ended.</p><a href="/">Sign in again</a></html>';
        }
        location = /oauth2/userinfo { return 404; }
        location = /oauth2/auth { return 404; }
        location / {
            if ($bad_origin) { return 403; }
            set $proxy http://oauth2-proxy:4180;
            proxy_pass $proxy;
            include /etc/nginx/proxy_params_operion;
        }
    }
}
