http_address = "0.0.0.0:4180"
provider = "oidc"
provider_display_name = "Operion local identity"
oidc_issuer_url = "https://operion.localhost:8443/identity/realms/operion"
client_id = "operion"
client_secret_file = "/run/secrets/client-secret"
provider_ca_files = ["/run/tls/ca.crt"]
redirect_url = "https://operion.localhost:8443/oauth2/callback"
scope = "openid profile email"
code_challenge_method = "S256"
insecure_oidc_skip_nonce = false
email_domains = ["example.test"]
skip_provider_button = true
reverse_proxy = true
upstreams = ["http://web:3000/"]
pass_access_token = true
pass_authorization_header = false
set_authorization_header = false
set_xauthrequest = false
skip_auth_strip_headers = true
skip_jwt_bearer_tokens = false
api_routes = ["^/api/"]
cookie_name = "__Host-operion_session"
cookie_secret_file = "/run/secrets/cookie-secret"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "1m"
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 5
session_store_type = "redis"
redis_connection_url = "redis://redis:6379/0"
# Private network endpoint; avoids placing the ID token in a browser URL.
backend_logout_url = "https://operion.localhost:8443/identity/realms/operion/protocol/openid-connect/logout?id_token_hint={id_token}"
request_logging = false
auth_logging = false
# Provider errors can contain callback URLs or logout tokens. Safe request
# status/timing is recorded at ingress; raw OAuth diagnostics stay disabled.
standard_logging = false
proxy_websockets = false
upstream_timeout = "120s"
