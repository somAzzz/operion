[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "operion-etl"
version = "0.1.0"
description = "Reproducible Wide World Importers sample ETL for Operion"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "httpx2==2.13.0",
    "mcp>=2,<3",
    "pydantic-ai-slim[ag-ui,openai]==2.46.0",
    "psycopg[binary]==3.3.6",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1"]

[project.scripts]
operion-etl = "operion_etl.cli:main"
operion-mcp = "operion_etl.mcp_server:main"
operion-agent = "operion_etl.agent_app:main"
operion-evaluate-e2 = "operion_etl.e2_evaluation:main"
operion-model-compatibility = "operion_etl.model_compatibility:main"
operion-action-api = "operion_etl.action_app:main"
operion-action-migrate = "operion_etl.action_store:migration_main"
operion-action-worker = "operion_etl.action_worker:main"
operion-evaluate-e3 = "operion_etl.e3_evaluation:main"
operion-probe-e3 = "operion_etl.e3_capability:main"
operion-evaluate-e4 = "operion_etl.e4_evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
operion_etl = ["migrations/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
show-fixes = true
unsafe-fixes = false
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["operion_etl"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
