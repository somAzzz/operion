[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "operion-etl"
version = "0.1.0"
description = "Reproducible Wide World Importers sample ETL for Operion"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1"]

[project.scripts]
operion-etl = "operion_etl.cli:main"
operion-mcp = "operion_etl.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
show-fixes = true
unsafe-fixes = false
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["operion_etl"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
